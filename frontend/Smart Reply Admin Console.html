<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Reply Admin Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Poppins:wght@500;600;700&family=Noto+Sans+Sinhala:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#002D70; --blue:#0B6FD4; --magenta:#C810B0; --pink:#E40675;
  --paper:#F1F5FA; --card:#FFFFFF; --card-2:#F5F8FC;
  --ink:#062043; --ink-2:#5B7191; --ink-3:#8DA0BA;
  --rule:#E0E7F0; --rule-2:#C7D4E4;
  --ok:#0B8A5C; --ok-bg:#E0F3EB;
  --warn:#A96C08; --warn-bg:#FBEFD6;
  --bad:#BE3220; --bad-bg:#FBE3DE;
  --info:#0B6FD4; --info-bg:#E4EFFC;
  --r:10px; --r-sm:7px; --rail:246px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#050F1F; --card:#0B1D35; --card-2:#112845;
  --ink:#E8EFF8; --ink-2:#93A9C6; --ink-3:#6C83A3;
  --rule:#1A3252; --rule-2:#27476E;
  --blue:#4FA6F8; --magenta:#EE72DA; --pink:#FF69A8;
  --ok:#4CCB92; --ok-bg:#0D3228; --warn:#E0AF59; --warn-bg:#392C11;
  --bad:#F08370; --bad-bg:#3B1B15; --info:#4FA6F8; --info-bg:#102E4C;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#050F1F; --card:#0B1D35; --card-2:#112845;
  --ink:#E8EFF8; --ink-2:#93A9C6; --ink-3:#6C83A3;
  --rule:#1A3252; --rule-2:#27476E;
  --blue:#4FA6F8; --magenta:#EE72DA; --pink:#FF69A8;
  --ok:#4CCB92; --ok-bg:#0D3228; --warn:#E0AF59; --warn-bg:#392C11;
  --bad:#F08370; --bad-bg:#3B1B15; --info:#4FA6F8; --info-bg:#102E4C;
  color-scheme:dark;
}

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Archivo','Noto Sans Sinhala',system-ui,sans-serif;font-size:14.5px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3,.num{font-family:'Poppins','Noto Sans Sinhala',sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
a{color:var(--blue)}

/* shell */
.shell{display:flex;min-height:100vh}
.rail{width:var(--rail);flex:0 0 var(--rail);background:var(--card);border-right:1px solid var(--rule);position:fixed;inset:0 auto 0 0;z-index:40;display:flex;flex-direction:column;transition:transform .2s}
.brand{padding:14px 16px 12px;border-bottom:1px solid var(--rule);position:relative}
.brand::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--pink),var(--magenta) 40%,var(--blue))}
.brand img{width:100%;max-width:196px;height:auto;display:block}
.nav{padding:8px 9px 26px;overflow-y:auto;flex:1}
.nav h2{font-size:10.5px;font-weight:700;color:var(--ink-3);padding:15px 9px 5px;letter-spacing:.05em}
.nav button{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:var(--r-sm);width:100%;text-align:left;font-size:14px;position:relative;color:var(--ink)}
.nav button:hover{background:var(--card-2)}
.nav button.on{background:var(--info-bg);color:var(--blue);font-weight:600}
.nav button.on::before{content:"";position:absolute;left:-9px;top:6px;bottom:6px;width:3px;background:var(--blue);border-radius:0 3px 3px 0}
.nav .ic{width:16px;text-align:center;flex:none;font-size:13px;opacity:.85}
.nav .ct{margin-left:auto;font-size:10.5px;font-weight:700;background:var(--bad-bg);color:var(--bad);padding:1px 6px;border-radius:9px}
.nav .ct.n{background:var(--card-2);color:var(--ink-2)}
.main{flex:1;min-width:0;margin-left:var(--rail)}

.top{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:11px;padding:10px 20px;min-height:57px}
.burger{display:none;padding:6px;border-radius:var(--r-sm)}
.burger svg{width:19px;height:19px;display:block}
.pick{position:relative;display:flex}
.pick select{appearance:none;border:1px solid var(--rule-2);background:var(--card);padding:6px 28px 6px 10px;border-radius:var(--r-sm);font-size:13.5px;font-weight:500;max-width:min(48vw,260px);cursor:pointer}
.pick::after{content:"";position:absolute;right:10px;top:50%;width:6px;height:6px;border-right:1.6px solid var(--ink-2);border-bottom:1.6px solid var(--ink-2);transform:translateY(-4px) rotate(45deg);pointer-events:none}
.top .sp{margin-left:auto}
.tbtn{width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--ink-2);position:relative}
.tbtn:hover{background:var(--card-2);color:var(--ink)}
.tbtn svg{width:17px;height:17px}
.tbtn .bdg{position:absolute;top:2px;right:2px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--pink);color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center;border:2px solid var(--card)}
.who{display:flex;align-items:center;gap:8px;padding-left:10px;border-left:1px solid var(--rule)}
.who b{font-size:13px;font-weight:600;display:block;line-height:1.2}
.who span{font-size:11px;color:var(--ink-2)}
.who i{width:30px;height:30px;border-radius:50%;background:var(--info-bg);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:12px;font-style:normal;flex:none}

.page{padding:20px 20px 60px;max-width:1460px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{font-size:23px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.ph p{color:var(--ink-2);font-size:13.5px;margin-top:2px;max-width:76ch}
.ph .acts{display:flex;gap:7px;flex-wrap:wrap}

/* atoms */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:var(--r-sm);font-size:13.5px;font-weight:600;border:1px solid var(--rule-2);background:var(--card)}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
:root[data-theme="dark"] .btn.pri{color:#04203F}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:5px}
.btn.dgr{color:var(--bad);border-color:var(--bad)}

.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--card-2);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.w{background:var(--warn-bg);color:var(--warn)}
.chip.b{background:var(--bad-bg);color:var(--bad)}
.chip.i{background:var(--info-bg);color:var(--info)}
.chip.law{background:var(--bad-bg);color:var(--bad);border-radius:4px;font-family:ui-monospace,Menlo,monospace;font-size:10.5px}

.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.card-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:12px 15px;border-bottom:1px solid var(--rule)}
.card-h h2{font-size:14.5px;font-weight:600}
.card-h .sp{margin-left:auto}
.card-b{padding:14px 15px}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gmain{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}

.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;background:var(--card);margin-bottom:14px}
.stat{padding:14px 16px;border-right:1px solid var(--rule)}
.stat:last-child{border-right:0}
.stat span{font-size:12.5px;color:var(--ink-2)}
.stat b{display:block;font-family:'Poppins',sans-serif;font-size:26px;font-weight:700;letter-spacing:-.03em;margin-top:4px;line-height:1}
.stat small{font-size:11.5px;color:var(--ink-2);display:block;margin-top:5px}
.stat.ok b{color:var(--ok)} .stat.w b{color:var(--warn)} .stat.b b{color:var(--bad)} .stat.i b{color:var(--blue)}

table{width:100%;border-collapse:collapse}
.tw{overflow-x:auto}
thead th{text-align:left;font-size:11.5px;font-weight:600;color:var(--ink-2);padding:9px 15px;border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--card-2)}
tbody td{padding:10px 15px;border-bottom:1px solid var(--rule);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--card-2)}
td.r,th.r{text-align:right}
.emp{display:flex;align-items:center;gap:9px}
.emp i{width:28px;height:28px;border-radius:50%;background:var(--info-bg);color:var(--blue);display:grid;place-items:center;font-size:11px;font-weight:700;font-style:normal;flex:none}
.emp b{display:block;font-weight:600;font-size:13.5px}
.emp span{font-size:11px;color:var(--ink-2)}

.ln{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:13.5px;border-bottom:1px solid var(--rule)}
.ln:last-child{border-bottom:0}
.ln span{color:var(--ink-2)}
.ln b{font-weight:600}
.ln.neg b{color:var(--bad)}
.tot{display:flex;justify-content:space-between;margin-top:9px;padding-top:11px;border-top:2px solid var(--rule-2);font-size:15px;font-weight:700}

.note{display:flex;gap:10px;padding:11px 13px;border-radius:var(--r-sm);font-size:13px;margin-bottom:13px;align-items:flex-start}
.note.w{background:var(--warn-bg);color:var(--warn)}
.note.b{background:var(--bad-bg);color:var(--bad)}
.note.i{background:var(--info-bg);color:var(--info)}
.note.k{background:var(--ok-bg);color:var(--ok)}
.note b{display:block;font-weight:600}
.note .ic{flex:none;font-size:14px;line-height:1.3}

.meter{height:6px;border-radius:3px;background:var(--card-2);border:1px solid var(--rule);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue)}

.list-row{display:flex;gap:11px;align-items:flex-start;padding:11px 15px;border-bottom:1px solid var(--rule)}
.list-row:last-child{border-bottom:0}
.list-row .dot{width:7px;height:7px;border-radius:50%;margin-top:6px;flex:none;background:var(--ink-3)}
.list-row .dot.ok{background:var(--ok)} .list-row .dot.w{background:var(--warn)} .list-row .dot.b{background:var(--bad)} .list-row .dot.i{background:var(--blue)}
.list-row .bd{flex:1;min-width:0}
.list-row .bd b{display:block;font-size:13.5px;font-weight:600}
.list-row .bd span{font-size:12px;color:var(--ink-2)}
.list-row .rt{flex:none;display:flex;gap:6px;align-items:center}

label.f{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin:12px 0 4px}
.f-in{width:100%;padding:8px 10px;border:1px solid var(--rule-2);border-radius:var(--r-sm);background:var(--card);font-size:13.5px}
textarea.f-in{resize:vertical;min-height:62px;font-family:inherit}
.f-row{display:grid;gap:10px}
.f2{grid-template-columns:1fr 1fr}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:4px}

.seg{display:inline-flex;border:1px solid var(--rule-2);border-radius:var(--r-sm);overflow:hidden;background:var(--card)}
.seg button{padding:6px 11px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#04203F}

.empty{padding:44px 20px;text-align:center;color:var(--ink-2);font-size:13.5px}
.empty b{display:block;color:var(--ink);font-size:15px;font-weight:600;margin-bottom:4px;font-family:'Poppins',sans-serif}

/* steps / wizard */
.steps{display:flex;gap:0;margin-bottom:16px;flex-wrap:wrap}
.step{flex:1;min-width:130px;padding:10px 12px;border:1px solid var(--rule);border-right:0;background:var(--card);font-size:12.5px;color:var(--ink-2)}
.step:first-child{border-radius:var(--r) 0 0 var(--r)}
.step:last-child{border-right:1px solid var(--rule);border-radius:0 var(--r) var(--r) 0}
.step b{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-top:1px}
.step.on{background:var(--info-bg);border-color:var(--blue)}
.step.on b{color:var(--blue)}
.step.dn{background:var(--ok-bg)}
.step.dn b{color:var(--ok)}
.step .n{font-family:ui-monospace,monospace;font-size:10.5px;opacity:.7}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:5px;top:5px;bottom:5px;width:2px;background:var(--rule)}
.tl-i{position:relative;padding-bottom:15px}
.tl-i:last-child{padding-bottom:0}
.tl-i::before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--rule-2)}
.tl-i.hi::before{border-color:var(--blue);background:var(--blue)}
.tl-i b{display:block;font-size:13.5px;font-weight:600}
.tl-i span{font-size:12px;color:var(--ink-2)}

/* org chart */
.org{overflow-x:auto;padding:8px 0}
.org-l{display:flex;gap:10px;justify-content:center;flex-wrap:nowrap;min-width:min-content;margin-bottom:24px;position:relative}
.org-n{border:1px solid var(--rule);background:var(--card);border-radius:var(--r-sm);padding:9px 12px;min-width:132px;text-align:center;position:relative}
.org-n b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap}
.org-n span{font-size:10.5px;color:var(--ink-2);white-space:nowrap}
.org-n.hd{border-color:var(--blue);background:var(--info-bg)}
.org-l::after{content:"";position:absolute;left:50%;bottom:-13px;width:1px;height:13px;background:var(--rule-2)}
.org-l:last-child::after{display:none}

/* kanban */
.kb{display:grid;grid-template-columns:repeat(5,minmax(160px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.kb-c{background:var(--card-2);border:1px solid var(--rule);border-radius:var(--r-sm);padding:9px;min-width:160px}
.kb-c h3{font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:8px;display:flex;justify-content:space-between}
.kb-i{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:8px 9px;margin-bottom:6px}
.kb-i b{display:block;font-size:12.5px;font-weight:600}
.kb-i span{font-size:10.5px;color:var(--ink-2)}

/* toast + sheet */
/* roster cells */
.rcell{border-radius:6px;padding:5px 7px;font-size:11.5px;line-height:1.35;min-width:104px}
.rcell b{display:block;font-size:12px;font-weight:600}
.rcell span{color:var(--ink-2);display:block}
.rcell .mode{display:inline-flex;align-items:center;gap:3px;margin-top:3px;font-size:10.5px;font-weight:600}
.rcell.office{background:var(--info-bg)}
.rcell.office .mode{color:var(--info)}
.rcell.wfh{background:var(--ok-bg)}
.rcell.wfh .mode{color:var(--ok)}
.rcell.split{background:linear-gradient(105deg,var(--info-bg) 0 48%,var(--ok-bg) 48% 100%)}
.rcell.off{background:var(--card-2);color:var(--ink-3)}
.rcell.hol{background:var(--warn-bg);color:var(--warn)}
.rcell.bad{outline:2px solid var(--bad);outline-offset:-2px}

/* approval strip */
.appr{display:flex;gap:0;margin-bottom:14px;flex-wrap:wrap}
.appr-s{flex:1;min-width:150px;padding:11px 13px;border:1px solid var(--rule);border-right:0;background:var(--card);font-size:12px;color:var(--ink-2)}
.appr-s:first-child{border-radius:var(--r) 0 0 var(--r)}
.appr-s:last-child{border-right:1px solid var(--rule);border-radius:0 var(--r) var(--r) 0}
.appr-s b{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-top:1px}
.appr-s.dn{background:var(--ok-bg);border-color:transparent}
.appr-s.dn b{color:var(--ok)}
.appr-s.now{background:var(--info-bg);border-color:var(--blue)}
.appr-s.now b{color:var(--blue)}
.appr-s .who{font-size:10.5px;opacity:.85;border:0;padding:0;margin-top:2px;display:block}

/* session rows */
tr.sess td{background:var(--card-2);font-size:12.5px;padding-top:7px;padding-bottom:7px;color:var(--ink-2);border-bottom:1px dashed var(--rule)}
tr.sess td:first-child{padding-left:38px;position:relative}
tr.sess td:first-child::before{content:"↳";position:absolute;left:20px;color:var(--ink-3)}
tr.sess.last td{border-bottom:1px solid var(--rule)}
.exp{width:20px;height:20px;border-radius:4px;border:1px solid var(--rule-2);display:inline-grid;place-items:center;font-size:11px;color:var(--ink-2);margin-right:7px;vertical-align:middle;line-height:1}
.mchip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:10px}
.mchip.o{background:var(--info-bg);color:var(--info)}
.mchip.w{background:var(--ok-bg);color:var(--ok)}

/* pay calendar */
.pc{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.pc-h{text-align:center;font-size:11px;font-weight:700;color:var(--ink-3);padding-bottom:4px}
.pc-d{border:1px solid var(--rule);border-radius:7px;padding:7px 8px;min-height:74px;background:var(--card);text-align:left;display:flex;flex-direction:column;gap:3px}
.pc-d:hover{border-color:var(--ink-3)}
.pc-d .n{font-size:13px;font-weight:600}
.pc-d .t{font-size:10.5px;line-height:1.25;color:var(--ink-2)}
.pc-d .x{margin-top:auto;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:9px;align-self:flex-start}
.pc-d.pad{border-color:transparent;background:transparent;min-height:0}
.pc-d.wk{background:var(--card-2)}
.pc-d.half{background:var(--card-2)}
.pc-d.poya{background:var(--warn-bg);border-color:transparent}
.pc-d.poya .n,.pc-d.poya .t{color:var(--warn)}
.pc-d.pub{background:var(--bad-bg);border-color:transparent}
.pc-d.pub .n,.pc-d.pub .t{color:var(--bad)}
.pc-d.co{background:var(--info-bg);border-color:transparent}
.pc-d.co .n,.pc-d.co .t{color:var(--info)}
.pc-d.sel{outline:2px solid var(--blue);outline-offset:-2px}
.x2{background:var(--bad);color:#fff}
.x15{background:var(--warn);color:#fff}
.x1{background:var(--rule-2);color:var(--ink-2)}

/* payslip designer */
.slipwrap{background:var(--card-2);border:1px solid var(--rule);border-radius:var(--r);padding:18px;overflow-x:auto}
.slip{background:#fff;color:#14203a;width:640px;max-width:100%;margin:0 auto;padding:26px 28px;
  border-radius:3px;box-shadow:0 2px 14px rgba(10,25,50,.14);font-size:12px;line-height:1.45}
.slip *{border-color:#d8dfe9}
.slip-top{display:flex;gap:14px;align-items:flex-start;border-bottom:2px solid #14203a;padding-bottom:13px;margin-bottom:14px}
.slip-top img{width:112px;height:auto;flex:none}
.slip-co{flex:1;min-width:0}
.slip-co b{display:block;font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.slip-co span{display:block;font-size:11px;color:#5d6d85;margin-top:2px}
.slip-ttl{text-align:right;flex:none}
.slip-ttl b{display:block;font-size:12.5px;font-weight:700;letter-spacing:.06em}
.slip-ttl span{font-size:11px;color:#5d6d85}
.slip-meta{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;margin-bottom:14px}
.slip-meta div{display:flex;justify-content:space-between;font-size:11.5px;padding:2px 0}
.slip-meta span{color:#5d6d85}
.slip-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;margin-bottom:12px}
.slip-cols h4{font-size:10.5px;font-weight:700;letter-spacing:.07em;color:#5d6d85;border-bottom:1px solid #d8dfe9;padding-bottom:4px;margin-bottom:5px}
.slip-r{display:flex;justify-content:space-between;padding:2.5px 0;font-size:11.5px}
.slip-r.sum{border-top:1px solid #d8dfe9;margin-top:4px;padding-top:5px;font-weight:700}
.slip-net{display:flex;justify-content:space-between;align-items:center;background:#eef3fa;border:1px solid #d8dfe9;border-radius:4px;padding:11px 14px;margin-bottom:12px}
.slip-net span{font-size:11.5px;color:#5d6d85;display:block}
.slip-net b{font-size:12.5px;font-weight:700;display:block}
.slip-net .amt{font-size:21px;font-weight:700;letter-spacing:-.02em}
.slip-x{border-top:1px solid #d8dfe9;padding-top:9px;margin-bottom:9px}
.slip-x h4{font-size:10.5px;font-weight:700;letter-spacing:.07em;color:#5d6d85;margin-bottom:4px}
.slip-x p{font-size:11px;color:#3d4b63}
.slip-foot{border-top:1px solid #d8dfe9;padding-top:9px;font-size:10px;color:#7a89a0;text-align:center}
.slip[data-lang="si"]{font-family:'Noto Sans Sinhala','Archivo',sans-serif}
.slip.center .slip-top{flex-direction:column;align-items:center;text-align:center}
.slip.center .slip-ttl{text-align:center}
.tgl{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--rule);font-size:13.5px;cursor:pointer}
.tgl:last-child{border-bottom:0}
.tgl input{width:16px;height:16px;accent-color:var(--blue);flex:none;cursor:pointer}
.tgl span{flex:1}
.tgl small{color:var(--ink-3);font-size:11px}

/* plan tiers */
.tier{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:16px 17px;display:flex;flex-direction:column}
.tier.on{border-color:var(--blue);border-width:2px;padding:15px 16px}
.tier h3{font-family:'Poppins',sans-serif;font-size:17px;font-weight:600;letter-spacing:-.02em}
.tier .sz{font-size:12px;color:var(--ink-2);margin-top:1px}
.tier .pr{font-family:'Poppins',sans-serif;font-size:26px;font-weight:700;letter-spacing:-.03em;margin:11px 0 1px;line-height:1}
.tier .pr small{font-size:12.5px;font-weight:500;color:var(--ink-2);letter-spacing:0}
.tier ul{list-style:none;padding:0;margin:12px 0 0;font-size:13px;color:var(--ink-2);flex:1}
.tier li{padding:3px 0 3px 17px;position:relative}
.tier li::before{content:"\2713";position:absolute;left:0;color:var(--ok);font-weight:700;font-size:11px}
.tier li.no{color:var(--ink-3)}
.tier li.no::before{content:"\2013";color:var(--ink-3)}
.tier .cnt{margin-top:12px;padding-top:11px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink-2)}
.tier .cnt b{color:var(--ink);font-weight:600}
#nav button.dim{opacity:.32}
#nav button.dim .ct{display:none}

.toasts{position:fixed;bottom:16px;right:16px;z-index:80;display:flex;flex-direction:column;gap:7px;max-width:340px}
.toast{background:var(--ink);color:var(--paper);padding:10px 13px;border-radius:var(--r-sm);font-size:13px;font-weight:500;animation:ti .2s ease}
@keyframes ti{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.scrim{position:fixed;inset:0;background:rgba(4,17,38,.5);z-index:50;display:none}
.scrim.on{display:block}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--card);border-left:1px solid var(--rule);z-index:51;transform:translateX(100%);transition:transform .25s cubic-bezier(.32,.72,0,1);overflow-y:auto;padding:18px 20px 40px}
.sheet.on{transform:none}
.sheet h2{font-size:18px;font-weight:600;letter-spacing:-.02em;margin-bottom:4px}
.sheet .sub{font-size:13px;color:var(--ink-2);margin-bottom:14px}
.sheet .x{position:absolute;top:14px;right:16px;font-size:20px;color:var(--ink-2);line-height:1}

@media (max-width:1180px){.g4{grid-template-columns:repeat(2,1fr)}.gmain{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--rule)}}
@media (max-width:900px){
  .rail{transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.25)}
  .rail.open{transform:none}
  .main{margin-left:0}
  .burger{display:grid;place-items:center}
  .who b,.who span{display:none}
  .page{padding:16px 13px 50px}
  .top{padding:9px 13px}
  .g2,.g3{grid-template-columns:1fr}
}
@media (max-width:620px){.stats{grid-template-columns:1fr}.stat{border-right:0;border-bottom:1px solid var(--rule)}.stat:last-child{border-bottom:0}.g4{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── Smart Reply additions ───────────────────── */
.grid>*{min-width:0}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:40px;height:40px;flex:none}
.logo b{display:block;font-family:'Poppins',sans-serif;font-size:21px;font-weight:700;letter-spacing:-.03em;line-height:1.05;color:var(--navy)}
:root[data-theme="dark"] .logo b{color:#fff}
.logo b em{font-style:normal;background:linear-gradient(90deg,#00A8E8,#1B6FC4 40%,#8E3FA0 75%,#E6287A);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo span{display:block;font-size:10.5px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.logo span i{font-style:normal;font-weight:800;color:var(--blue)}
.logo span u{text-decoration:none;font-weight:800;color:var(--magenta)}

.wa{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ok);background:var(--ok-bg);padding:5px 10px;border-radius:20px;white-space:nowrap}
.wa::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.rolesw{display:inline-flex;border:1px solid var(--rule-2);border-radius:var(--r-sm);overflow:hidden}
.rolesw button{padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.rolesw button+button{border-left:1px solid var(--rule)}
.rolesw button[aria-pressed="true"]{background:var(--navy);color:#fff}
:root[data-theme="dark"] .rolesw button[aria-pressed="true"]{background:var(--blue);color:#04203F}

.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;font-style:normal;flex:none;background:var(--info-bg);color:var(--blue)}
.av.lg{width:64px;height:64px;font-size:22px}
.av.md{width:38px;height:38px;font-size:13px}
.av.a1{background:#F7E4D6;color:#8A3F12}.av.a2{background:#E8E1F7;color:#4B2E8F}.av.a3{background:#DDE7F8;color:#23458A}
.av.a4{background:#E0F3EB;color:#0B6446}.av.a5{background:#FBE3EF;color:#8A1F4E}.av.a6{background:#E6E9F0;color:#2E3550}.av.a7{background:#FBEFD6;color:#7A4300}
:root[data-theme="dark"] .av{filter:saturate(.9) brightness(.92)}
.st{position:relative}
.st::after{content:"";position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;border:2px solid var(--card);background:var(--ok)}
.st.busy::after,.st.away::after{background:var(--warn)}.st.call::after{background:var(--bad)}

/* inbox: list · thread · customer */
.ib{display:grid;grid-template-columns:310px minmax(0,1fr) 290px;background:var(--card);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;height:calc(100vh - 57px - 120px);min-height:560px}
.ib-l{border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0}
.ib-l .hd{padding:12px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:9px}
.ib-l .items{overflow-y:auto;flex:1}
.cv{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-bottom:1px solid var(--rule);width:100%;text-align:left;border-left:3px solid transparent}
.cv:hover{background:var(--card-2)}
.cv.on{background:var(--info-bg);border-left-color:var(--blue)}
.cv .bd{flex:1;min-width:0}
.cv .l1{display:flex;justify-content:space-between;gap:6px}
.cv .l1 b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv .l1 small{font-size:11px;color:var(--ink-3);flex:none}
.cv .pv{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin:1px 0 4px}
.cv.un .l1 b{font-weight:700}.cv.un .pv{color:var(--ink);font-weight:500}.cv.un .l1 small{color:var(--blue);font-weight:700}
.cv .tags{display:flex;gap:4px;flex-wrap:wrap}
.cv .n{background:var(--blue);color:#fff;font-size:10.5px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;flex:none;margin-top:18px}

.ib-t{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--card-2)}
.ib-t .hd{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--rule)}
.ib-t .hd .bd{flex:1;min-width:0}
.ib-t .hd .bd b{display:block;font-size:14.5px;font-weight:600}
.win{font-size:11.5px;font-weight:600;color:var(--ok)}
.win.x{color:var(--warn)}
.msgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:7px}
.day{align-self:center;font-size:11px;font-weight:600;color:var(--ink-2);background:var(--card);border:1px solid var(--rule);padding:2px 10px;border-radius:10px}
.bb{max-width:76%;padding:7px 11px 5px;border-radius:12px;font-size:13.5px;line-height:1.45;border:1px solid var(--rule);background:var(--card)}
.bb.in{align-self:flex-start;border-top-left-radius:3px}
.bb.out{align-self:flex-end;background:var(--info-bg);border-color:transparent;border-top-right-radius:3px}
.bb .by{display:block;font-size:10.5px;font-weight:700;color:var(--blue)}
.bb .tp{display:block;font-size:10.5px;font-weight:700;color:var(--magenta)}
.bb .mt{display:block;text-align:right;font-size:10.5px;color:var(--ink-3);margin-top:1px}
.bb .mt .rd{color:var(--blue);font-weight:700;margin-left:3px}
.bb .bt{display:flex;margin:6px -11px -5px;border-top:1px solid var(--rule-2)}
.bb .bt span{flex:1;text-align:center;padding:7px 4px;font-size:12.5px;font-weight:600;color:var(--blue)}
.bb .bt span+span{border-left:1px solid var(--rule-2)}
.nt{align-self:center;width:80%;background:var(--warn-bg);border:1px dashed var(--warn);border-radius:var(--r-sm);padding:7px 11px;font-size:12.5px;color:var(--ink)}
.nt b{display:block;font-size:10.5px;color:var(--warn);font-weight:700}
.sys{align-self:center;font-size:11.5px;color:var(--ink-2);background:var(--card);border:1px solid var(--rule);padding:4px 10px;border-radius:12px}
.sys.b{color:var(--bad)}
.cmp{border-top:1px solid var(--rule);background:var(--card);padding:9px 12px 11px}
.cmp .qk{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
/* attachments */
.att{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.bb .att{margin:3px 0 5px}
.att-img{position:relative;display:block}
.att-img img{width:72px;height:72px;border-radius:8px;object-fit:cover;border:1px solid var(--rule);display:block;background:var(--card-2)}
.bb .att-img img{width:230px;height:auto;max-height:230px}
.att-file{display:flex;align-items:center;gap:9px;border:1px solid var(--rule);border-radius:8px;padding:7px 10px;background:var(--card);max-width:260px;position:relative}
.att-file .ext{width:30px;height:36px;border-radius:5px;background:var(--bad-bg);color:var(--bad);font-size:9px;font-weight:800;display:grid;place-items:center;flex:none;letter-spacing:.02em}
.att-file .ext.x{background:var(--ok-bg);color:var(--ok)}.att-file .ext.w{background:var(--info-bg);color:var(--info)}
.att-file b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.att-file span{font-size:11px;color:var(--ink-2)}
.att-voice{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:22px;padding:5px 12px 5px 5px;background:var(--card);min-width:210px;position:relative}
.att-voice .pl{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px;flex:none;display:grid;place-items:center}
:root[data-theme="dark"] .att-voice .pl{color:#04203F}
.att-voice small{font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.att-voice audio{height:32px;max-width:230px}
.wave{display:flex;align-items:center;gap:2px;flex:1;height:24px}
.wave i{display:block;width:3px;border-radius:2px;background:var(--rule-2);transition:background .2s}
.att-voice.play .wave i{background:var(--blue);animation:wv 1s ease-in-out infinite alternate}
.att-voice.play .wave i:nth-child(2n){animation-delay:.2s}.att-voice.play .wave i:nth-child(3n){animation-delay:.4s}
@keyframes wv{from{transform:scaleY(.55)}to{transform:scaleY(1)}}
.att .rm{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:12px;line-height:1;display:grid;place-items:center}
.attb{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.attb label{cursor:pointer}
.attb input{display:none}
.recon{color:var(--bad)!important;border-color:var(--bad)!important;background:var(--bad-bg)!important}
.pend{display:flex;gap:10px;flex-wrap:wrap;margin:2px 0 10px;padding-top:6px}
.qa{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--card-2);color:var(--ink-2);margin:2px 4px 2px 0;white-space:nowrap}

.cmp .row{display:flex;gap:8px;align-items:center}
.cmp .f-in{flex:1}
.cmp.nmode .f-in{background:var(--warn-bg);border-color:var(--warn)}
.cmp .tbtn.on{background:var(--warn-bg);color:var(--warn)}

.ib-c{border-left:1px solid var(--rule);overflow-y:auto;padding:14px}
.ib-c .who2{text-align:center;padding:4px 0 12px}
.ib-c .who2 .av{margin:0 auto 8px}
.ib-c .who2 b{display:block;font-size:15px;font-weight:600}
.ib-c .who2 span{font-size:12px;color:var(--ink-2);display:block}
.ib-c h3{font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.05em;margin:14px 0 6px;text-transform:uppercase}
.ib-c .tags{display:flex;gap:5px;flex-wrap:wrap}
.acts4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.acts4 button{border:1px solid var(--rule);border-radius:var(--r-sm);padding:7px 2px;font-size:11.5px;font-weight:600;color:var(--blue);display:flex;flex-direction:column;align-items:center;gap:2px}
.acts4 button span{font-size:15px}
.acts4 button.dg{color:var(--bad)}

/* incoming call banner */
.ring{display:flex;align-items:center;gap:13px;padding:13px 15px;border-radius:var(--r);margin-bottom:14px;color:#fff;background:linear-gradient(120deg,#0A2458,#2E3192 60%,#6B3A9E)}
.ring .bd{flex:1;min-width:0}
.ring small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:#7FD1F5}
.ring b{display:block;font-size:15.5px;font-weight:600}
.ring span{font-size:12px;color:#C9D3F0}
.ring .btn{border:0}
.ring .yes{background:#0B8A5C;color:#fff}.ring .no{background:#BE3220;color:#fff}

/* active call sheet */
.callv{margin:-18px -20px -40px;min-height:100vh;padding:22px 20px 30px;color:#fff;background:linear-gradient(180deg,#0A2458,#1E2470 70%,#3A2A80);display:flex;flex-direction:column;align-items:center;text-align:center}
.callv .av{margin:18px 0 10px}
.callv h2{font-size:22px;color:#fff}
.callv .tm{font-size:15px;color:#C9D3F0;font-variant-numeric:tabular-nums}
.callv .rec{font-size:11.5px;font-weight:600;color:#FFB4AB;background:rgba(255,120,110,.14);padding:3px 11px;border-radius:12px;margin-top:8px}
.tr{align-self:stretch;text-align:left;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:var(--r);padding:13px 14px;margin:18px 0}
.tr h4{font-size:11px;letter-spacing:.06em;color:#7FD1F5;margin-bottom:8px}
.tr p{font-size:13px;margin-bottom:8px}
.tr p b{display:block;font-size:10.5px;color:#C9D3F0}
.tr .sg{background:rgba(127,209,245,.13);border-radius:var(--r-sm);padding:8px 10px;font-size:12.5px}
.cbtns{display:flex;gap:18px;margin:6px 0 18px}
.cbtns button{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:18px}
.cbtns button.on{background:#fff;color:#0A2458}
.endc{width:64px;height:64px;border-radius:50%;background:#D93A2F;color:#fff;font-size:24px}

/* catalog */
.prod{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.prod .art{height:128px;background:var(--card-2);display:grid;place-items:center;border-bottom:1px solid var(--rule)}
.prod .art svg{width:150px;height:110px}
.prod .in{padding:11px 13px 13px}
.prod b{display:block;font-size:13.5px;font-weight:600}
.prod .pr{font-family:'Poppins',sans-serif;font-size:17px;font-weight:700;color:var(--blue);letter-spacing:-.02em;margin-top:2px}
.prod .pr s{font-size:12px;color:var(--ink-3);font-weight:500;margin-left:6px}
.prod span{font-size:12px;color:var(--ink-2)}

/* template preview */
.tpv{background:var(--card-2);border:1px solid var(--rule);border-radius:var(--r-sm);padding:14px}
.tpv .bb{max-width:100%}
code.cmd{font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:700;background:var(--info-bg);color:var(--blue);padding:2px 7px;border-radius:5px}

/* bars */
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;height:150px;padding-top:8px}
.bars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--ink-2)}
.bars i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:var(--info-bg);border:1px solid var(--rule)}
.bars .hi i{background:var(--blue);border-color:var(--blue)}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:6px 0 8px}
.split i{display:block}

@media (max-width:1180px){.ib{grid-template-columns:280px minmax(0,1fr)}.ib-c{display:none}}
@media (max-width:760px){.ib{grid-template-columns:1fr;height:auto}.ib-l .items{max-height:320px}.ib-t{min-height:520px}.top .wa,.rolesw{display:none}}


/* ── v2: statuses, owners, 24h window, IVR, call controls ── */
:root{--g:#0B8A5C;--g-bg:#DDF3E8;--y:#9A6A00;--y-bg:#FFF1C2;--r:#C62828;--r-bg:#FDE1DE}
:root[data-theme="dark"]{--g:#4CCB92;--g-bg:#0D3228;--y:#F2C94C;--y-bg:#3A300D;--r:#FF7A6E;--r-bg:#44170F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:#4CCB92;--g-bg:#0D3228;--y:#F2C94C;--y-bg:#3A300D;--r:#FF7A6E;--r-bg:#44170F}}
.wt{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;font-variant-numeric:tabular-nums}
.wt b{font-weight:700;display:inline!important;font-size:inherit!important;color:inherit!important}
.wt.g{background:var(--g-bg);color:var(--g)}.wt.y{background:var(--y-bg);color:var(--y)}.wt.r{background:var(--r);color:#fff;animation:wpulse 1.6s infinite}.wt.x{background:var(--card-2);color:var(--ink-3)}
@keyframes wpulse{50%{box-shadow:0 0 0 4px var(--r-bg)}}
.cv.wg{box-shadow:inset 4px 0 0 var(--g)}.cv.wy{box-shadow:inset 4px 0 0 var(--y)}.cv.wr{box-shadow:inset 4px 0 0 var(--r);background-image:linear-gradient(90deg,var(--r-bg),transparent 45%)}
.wleg{display:flex;gap:11px;flex-wrap:wrap;font-size:11px;color:var(--ink-2);margin-top:8px}

window.AFTER.quick=function(){
 var pg=document.getElementById('page');
 function form(i){
  var q=i==null?{cmd:'/',t:'',x:'',att:[]}:D.quick[i],att=q.att.map(function(a){return Object.assign({},a);});
  __sheet('<h2>'+(i==null?'New quick reply':'Edit '+q.cmd)+'</h2><p class="sub">Staff type the command in a chat, or tap it above the message box.</p>'+
   '<div class="f-row f2"><div><label class="f" for="qCmd">Command</label><input class="f-in" id="qCmd" value="'+D.esc(q.cmd)+'"></div><div><label class="f" for="qWho">Who can use it</label><select class="f-in" id="qWho"><option>Everyone</option><option>Only me</option><option>Managers</option></select></div></div>'+
   '<label class="f" for="qT2">Title</label><input class="f-in" id="qT2" value="'+D.esc(q.t)+'" placeholder="e.g. Kitchen price list">'+
   '<label class="f" for="qX">Message text</label><textarea class="f-in" id="qX" rows="3" placeholder="Optional when you attach something">'+D.esc(q.x)+'</textarea>'+
   '<label class="f">Attachments</label><div class="attb">'+
    '<label class="btn sm">🖼 Image<input type="file" id="qImg" accept="image/jpeg,image/png" multiple></label>'+
    '<label class="btn sm">🎙 Voice file<input type="file" id="qAud" accept="audio/*"></label>'+
    '<button type="button" class="btn sm" id="qRec">● Record</button>'+
    '<label class="btn sm">📎 File<input type="file" id="qFile" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt" multiple></label></div>'+
   '<div class="att" id="qAtt" style="min-height:10px;padding-top:6px"></div>'+
   '<p class="hint">WhatsApp limits: JPG or PNG images up to 5 MB · voice and audio (OGG, MP3, M4A, AAC) up to 16 MB · PDF, Word, Excel and PowerPoint files up to 100 MB.</p>'+
   '<label class="f">Preview in chat</label><div class="tpv" id="qPrev"></div>'+
   '<button class="btn pri" id="qSave" style="width:100%;justify-content:center;margin-top:14px">Save quick reply</button>');
  var box=document.getElementById('sheetBody');
  function draw(){
   document.getElementById('qAtt').innerHTML=att.map(function(a,k){return D.att(a,k,true);}).join('')||'<span class="hint" style="margin:0">No attachments yet</span>';
   var x=document.getElementById('qX').value.trim();
   document.getElementById('qPrev').innerHTML='<div class="bb out" style="max-width:100%"><span class="by">You</span>'+D.attList(att)+(x?D.esc(x):'')+'<span class="mt">now<span class="rd">✓</span></span></div>';
  }
  draw();
  box.onchange=function(e){
   var t={qImg:'image',qAud:'voice',qFile:'file'}[e.target.id];if(!t)return;
   att=att.concat(D.readFiles(e.target.files,t));e.target.value='';draw();
  };
  box.oninput=function(e){if(e.target.id==='qX')draw();};
  box.onclick=function(e){
   var r=e.target.closest('[data-rm]');if(r){att.splice(+r.getAttribute('data-rm'),1);draw();return;}
   if(e.target.closest('#qRec')){D.toggleRecord(e.target.closest('#qRec'),function(a){att.push(a);draw();});return;}
   if(e.target.closest('#qSave')){
    var cmd=document.getElementById('qCmd').value.trim().replace(/\s+/g,'-');if(cmd.charAt(0)!=='/')cmd='/'+cmd;
    var x=document.getElementById('qX').value.trim(),t=document.getElementById('qT2').value.trim()||cmd;
    if(cmd.length<2){__toast('Give the quick reply a command, e.g. /colours');return;}
    if(!x&&!att.length){__toast('Add some text or at least one attachment.');return;}
    var dup=D.quick.some(function(o,k){return o.cmd===cmd&&k!==i;});if(dup){__toast(cmd+' already exists.');return;}
    var rec={cmd:cmd,t:t,x:x,att:att,used:i==null?0:D.quick[i].used,by:window.ROLE==='staff'?'Nimal':'Madushan P.'};
    if(i==null)D.quick.unshift(rec);else D.quick[i]=rec;
    __go('quick');__toast(cmd+' saved'+(att.length?' with '+att.length+' attachment'+(att.length>1?'s':''):'')+'.');
   }
  };
 }
 document.getElementById('qAdd').addEventListener('click',function(){form(null);});
 pg.onclick=function(e){
  var ed=e.target.closest('[data-qe]');if(ed){form(+ed.getAttribute('data-qe'));return;}
  var dl=e.target.closest('[data-qd]');if(dl){var q=D.quick.splice(+dl.getAttribute('data-qd'),1)[0];__go('quick');__toast(q.cmd+' deleted.');}
 };
};

 '<div class="card"><div class="card-h"><h2>Call hours</h2><span class="chip">Asia/Colombo</span></div><div class="card-b"><div class="ln"><span>Monday – Saturday</span><b>09:00 – 18:00</b></div><div class="ln"><span>Sunday & Poya</span><b>Closed</b></div><div class="ln"><span>Outside hours</span><b>'+fwdName('after')+'</b></div></div></div>'+

 rows.map(function(k){var c=D.contacts[k.c],m=CT[k.d]||CT.incoming,i=D.calls.indexOf(k);

 '</tbody></table></div></div>'+
 '<div class="note i"><span class="ic">◈</span><div><b>Calling needs the customer’s permission</b>A business can only call a customer who has allowed it, through the call_permission template or by calling the business first. Recording always plays an announcement.</div></div>';};

 return '<span style="font-size:12px;color:#C9D3F0">🔒 WhatsApp voice call · '+(CS.ivr?'IVR '+CS.ivr.k+' · '+esc(CS.ivr.t):'business line')+'</span>'+av(c,'lg')+'<h2>'+c.n+(ppl.length?' <small style="display:block;font-size:13px;font-weight:500;color:#C9D3F0">+ '+ppl.join(', ')+' · conference</small>':'')+'</h2>'+
  '<span class="tm">'+(CS.hold?'On hold · ':'')+'<span id="ctm">'+fmtDur(Date.now()-CS.t0)+'</span></span><span class="rec'+(CS.rec?'':' off')+'">'+(CS.rec?'● Recording · customer notified':'❚❚ Recording paused')+'</span>'+
  (CS.adding?'<div class="cpan"><b>Calling '+sName(CS.adding)+'…</b>They join when they answer.</div>':'')+
  (CS.warm?'<div class="cpan"><b>Talking to '+sName(CS.warm)+'</b>'+first(c.n)+' is on hold with music.<div class="cbt"><button data-w="xdone">Complete transfer</button><button data-w="xconf">Join all three</button><button data-w="xcancel">Back to customer</button></div></div>':'')+
  (ppl.length&&!CS.warm?'<div class="cpan"><b>Conference · '+(ppl.length+2)+' people</b><div class="cbt">'+CS.parts.map(function(p){return '<button data-w="rmp" data-v="'+p+'">Remove '+sName(p)+'</button>';}).join('')+'</div></div>':'')+
  (CS.pick?'<div class="cpan"><b>'+(CS.pick==='add'?'Add to call':'Transfer to')+'</b>'+(CS.pick==='xfer'?'<div class="cbt"><button data-w="xmode" data-v="warm" class="'+(CS.xm==='warm'?'':'gh')+'">Ask first</button><button data-w="xmode" data-v="blind" class="'+(CS.xm==='blind'?'':'gh')+'">Transfer now</button></div>':'')+

  '<div class="tr"><h4>✦ LIVE TRANSCRIPT</h4><p><b>'+first(c.n)+'</b>Pantry eke doors walata soft-close hinges danna puluwanda?</p><p><b>You</b>Ow puluwan. Saturday measurement ekata awama samples pennannam.</p></div>'+
  '<div class="cgrid">'+[['mute','🎙','Mute',CS.mute],['spk','🔊','Speaker',CS.spk],['hold','❚❚','Hold',CS.hold],['add','＋','Add',CS.pick==='add'],['xfer','⇄','Transfer',CS.pick==='xfer'],['rec','●','Record',CS.rec],['keypad','⌗','Keypad',false],['note','✎','Note',false]].map(function(b){return '<button data-w="cctl" data-v="'+b[0]+'" class="'+(b[3]?'on':'')+'"><i>'+b[1]+'</i>'+b[2]+'</button>';}).join('')+'</div>'+
  '<button class="endc" data-w="cend" aria-label="End call">✕</button>';}
function callDraw(){var e=$('#callv');if(e)e.innerHTML=callBody();}
window.__call=window.__call2=function(cid,ivr){var c=D.contacts[cid];
 CS={c:cid,t0:Date.now(),parts:[],rec:CFG.rec.auto,ever:CFG.rec.auto,xm:'warm',ivr:ivr||null};
 window.__sheet('<div class="callv" id="callv">'+callBody()+'</div>');
 var iv=setInterval(function(){var e=$('#ctm');if(e&&CS)e.textContent=fmtDur(Date.now()-CS.t0);},1000);
 window.__onClose=function(){clearInterval(iv);if(CS)endCall(null,null,true);};};
function endCall(type,note,silent){var cs=CS;if(!cs)return;CS=null;var s=Math.floor((Date.now()-cs.t0)/1000),dur=Math.floor(s/60)+':'+pad(s%60),c=D.contacts[cs.c],v=convOf(cs.c);
 if(D.calls[0]&&D.calls[0].d==='ringing'&&D.calls[0].c===cs.c)D.calls.shift();
 var rec=cs.ever&&s>0;note=note||(cs.parts.length?'Conference with '+cs.parts.map(sName).join(', '):'');
 D.calls.unshift({c:cs.c,d:type||(cs.ivr||cs.inc?'incoming':'outgoing'),t:'Today '+nowT(),dur:dur,by:meName(),rec:rec?1:0,note:note});
 if(v)v.msgs.push(['sys','call','Voice call · '+dur+' · '+meName()+(note?' · '+note:'')+(rec?' · recording saved':''),nowT()]);
 if(!silent)window.__close();
 window.__toast((type==='transferred'?note+'.':'Call ended · '+dur+'.')+(rec?' Recording and summary saved to '+first(c.n)+'’s chat.':''));}

 if(k==='add'||k==='xfer'){CS.pick=CS.pick===k?null:k;callDraw();return;}
 if(k==='rec'){if(!isM()&&!CFG.rec.pause&&CS.rec){window.__toast('Your manager doesn’t allow pausing recordings.');return;}CS.rec=!CS.rec;if(CS.rec)CS.ever=true;callDraw();window.__toast(CS.rec?'Recording on.':'Recording paused. Card or bank details said now won’t be saved.');return;}

 cs.pick=null;

 cs.warm=id;cs.hold=true;callDraw();};
