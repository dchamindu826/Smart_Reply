<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- LUMI Brand Gradient for signature icons -->
    <linearGradient id="lumiGradDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E6007E" stop-opacity="0.13"/>
      <stop offset="60%" stop-color="#8A2BE2" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#00A8E8" stop-opacity="0.14"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke="rgba(240, 245, 250, 0.07)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

    <!-- ===== LUMI LOGO ICON 1 (Top Left area) ===== -->
    <g transform="translate(48, 36) scale(0.65)" stroke="url(#lumiGradDark)" stroke-width="2.2">
      <!-- Arc over head -->
      <path d="M 28 8 A 24 24 0 0 1 52 26" />
      <!-- Brain / Bulb outer contour -->
      <path d="M 22 68 C 12 68 4 58 4 48 C 4 36 12 30 14 24 C 16 16 22 8 34 8" />
      <!-- Circuit base lines -->
      <line x1="16" y1="74" x2="34" y2="74" stroke-width="3" />
      <path d="M 20 80 C 22 84 28 84 30 80" stroke-width="2.5" />
      <!-- Circuit traces and nodes -->
      <path d="M 20 68 L 20 54 L 12 46 L 12 38" />
      <circle cx="12" cy="36" r="2.2" fill="rgba(230, 0, 126, 0.18)" />
      <path d="M 20 54 L 28 46 L 28 32 L 22 26" />
      <circle cx="22" cy="24" r="2.2" fill="rgba(138, 43, 226, 0.18)" />
      <path d="M 28 40 L 36 32 L 36 20" />
      <circle cx="36" cy="18" r="2.2" fill="rgba(0, 168, 232, 0.18)" />
      <path d="M 16 58 L 8 50 L 8 44" />
      <circle cx="8" cy="42" r="2" fill="rgba(230, 0, 126, 0.18)" />
      <!-- Branch nodes -->
      <circle cx="28" cy="46" r="1.8" fill="rgba(138, 43, 226, 0.18)" />
      <circle cx="20" cy="54" r="1.8" fill="rgba(0, 168, 232, 0.18)" />
    </g>

    <!-- ===== LUMI LOGO ICON 2 (Center Right area, tilted) ===== -->
    <g transform="translate(360, 240) rotate(-10) scale(0.62)" stroke="url(#lumiGradDark)" stroke-width="2.2">
      <path d="M 28 8 A 24 24 0 0 1 52 26" />
      <path d="M 22 68 C 12 68 4 58 4 48 C 4 36 12 30 14 24 C 16 16 22 8 34 8" />
      <line x1="16" y1="74" x2="34" y2="74" stroke-width="3" />
      <path d="M 20 80 C 22 84 28 84 30 80" stroke-width="2.5" />
      <path d="M 20 68 L 20 54 L 12 46 L 12 38" />
      <circle cx="12" cy="36" r="2.2" fill="rgba(230, 0, 126, 0.18)" />
      <path d="M 20 54 L 28 46 L 28 32 L 22 26" />
      <circle cx="22" cy="24" r="2.2" fill="rgba(138, 43, 226, 0.18)" />
      <path d="M 28 40 L 36 32 L 36 20" />
      <circle cx="36" cy="18" r="2.2" fill="rgba(0, 168, 232, 0.18)" />
      <path d="M 16 58 L 8 50 L 8 44" />
      <circle cx="8" cy="42" r="2" fill="rgba(230, 0, 126, 0.18)" />
    </g>

    <!-- ===== LUMI LOGO ICON 3 (Bottom Left area) ===== -->
    <g transform="translate(140, 410) scale(0.58)" stroke="url(#lumiGradDark)" stroke-width="2.2">
      <path d="M 28 8 A 24 24 0 0 1 52 26" />
      <path d="M 22 68 C 12 68 4 58 4 48 C 4 36 12 30 14 24 C 16 16 22 8 34 8" />
      <line x1="16" y1="74" x2="34" y2="74" stroke-width="3" />
      <path d="M 20 80 C 22 84 28 84 30 80" stroke-width="2.5" />
      <path d="M 20 68 L 20 54 L 12 46 L 12 38" />
      <circle cx="12" cy="36" r="2.2" fill="rgba(230, 0, 126, 0.18)" />
      <path d="M 20 54 L 28 46 L 28 32 L 22 26" />
      <circle cx="22" cy="24" r="2.2" fill="rgba(138, 43, 226, 0.18)" />
      <path d="M 28 40 L 36 32 L 36 20" />
      <circle cx="36" cy="18" r="2.2" fill="rgba(0, 168, 232, 0.18)" />
    </g>

    <!-- ===== WHATSAPP DOODLES ===== -->

    <!-- Chat Bubble (Top Center) -->
    <g transform="translate(180, 40)">
      <path d="M 8 4 C 18 4 28 8 28 18 C 28 26 20 30 14 30 L 8 34 L 10 28 C 4 26 2 22 2 18 C 2 10 8 4 18 4 Z" />
      <circle cx="10" cy="17" r="1.3" fill="rgba(240, 245, 250, 0.08)" />
      <circle cx="15" cy="17" r="1.3" fill="rgba(240, 245, 250, 0.08)" />
      <circle cx="20" cy="17" r="1.3" fill="rgba(240, 245, 250, 0.08)" />
    </g>

    <!-- Coffee Cup (Top Right) -->
    <g transform="translate(320, 36)">
      <path d="M 6 12 L 24 12 C 24 22 20 26 15 26 C 10 26 6 22 6 12 Z" />
      <path d="M 24 14 C 28 14 28 20 24 21" />
      <line x1="4" y1="28" x2="26" y2="28" />
      <path d="M 11 5 Q 13 8 11 10" stroke-width="1.2" />
      <path d="M 16 4 Q 18 7 16 9" stroke-width="1.2" />
    </g>

    <!-- Headphones (Top Far Right) -->
    <g transform="translate(435, 45)">
      <path d="M 6 20 A 13 13 0 0 1 30 20" />
      <rect x="3" y="18" width="5" height="10" rx="2" />
      <rect x="28" y="18" width="5" height="10" rx="2" />
    </g>

    <!-- Camera (Mid Left) -->
    <g transform="translate(25, 160)">
      <rect x="4" y="8" width="28" height="20" rx="4" />
      <circle cx="18" cy="18" r="5.5" />
      <path d="M 11 8 L 13 4 L 23 4 L 25 8" />
      <circle cx="27" cy="12" r="1.2" fill="rgba(240, 245, 250, 0.08)" />
    </g>

    <!-- Paper Airplane (Upper Center) -->
    <g transform="translate(160, 140) rotate(-15)">
      <path d="M 2 16 L 28 2 L 18 28 L 14 18 Z" />
      <line x1="28" y1="2" x2="14" y2="18" />
    </g>

    <!-- Heart (Upper Right) -->
    <g transform="translate(275, 125)">
      <path d="M 14 6 C 10 0 2 2 2 10 C 2 17 14 24 14 24 C 14 24 26 17 26 10 C 26 2 18 0 14 6 Z" />
    </g>

    <!-- Smiley Face (Far Upper Right) -->
    <g transform="translate(420, 140)">
      <circle cx="16" cy="16" r="13" />
      <circle cx="11" cy="13" r="1.5" fill="rgba(240, 245, 250, 0.08)" />
      <circle cx="21" cy="13" r="1.5" fill="rgba(240, 245, 250, 0.08)" />
      <path d="M 10 19 Q 16 25 22 19" />
    </g>

    <!-- Double Music Notes (Center Left) -->
    <g transform="translate(100, 240)">
      <path d="M 8 22 L 8 8 L 24 4 L 24 18" />
      <ellipse cx="6" cy="22" rx="4" ry="3" fill="rgba(240, 245, 250, 0.06)" />
      <ellipse cx="22" cy="18" rx="4" ry="3" fill="rgba(240, 245, 250, 0.06)" />
      <line x1="8" y1="12" x2="24" y2="8" stroke-width="2.5" />
    </g>

    <!-- Padlock (Center) -->
    <g transform="translate(225, 220)">
      <rect x="5" y="12" width="20" height="15" rx="3" />
      <path d="M 9 12 L 9 8 A 6 6 0 0 1 21 8 L 21 12" />
      <circle cx="15" cy="19" r="2" fill="rgba(240, 245, 250, 0.08)" />
    </g>

    <!-- Smartphone (Far Right Center) -->
    <g transform="translate(450, 245)">
      <rect x="4" y="4" width="16" height="28" rx="3" />
      <line x1="9" y1="7" x2="15" y2="7" />
      <circle cx="12" cy="28" r="1.2" />
    </g>

    <!-- Clock / Timer (Lower Left) -->
    <g transform="translate(30, 290)">
      <circle cx="16" cy="16" r="13" />
      <polyline points="16,8 16,16 21,19" />
      <line x1="16" y1="1" x2="16" y2="3" stroke-width="2" />
    </g>

    <!-- Cloud (Center-Left Lower) -->
    <g transform="translate(145, 320)">
      <path d="M 7 20 C 4 20 2 17 3 14 C 4 11 8 10 10 11 C 12 6 20 6 23 10 C 26 10 29 13 28 17 C 28 20 25 20 22 20 Z" />
    </g>

    <!-- Game Controller (Center Lower) -->
    <g transform="translate(250, 310)">
      <path d="M 8 10 C 14 8 26 8 32 10 C 36 12 38 20 35 26 C 33 28 29 26 27 22 L 23 20 L 17 20 L 13 22 C 11 26 7 28 5 26 C 2 20 4 12 8 10 Z" />
      <!-- D-pad -->
      <line x1="11" y1="14" x2="11" y2="20" />
      <line x1="8" y1="17" x2="14" y2="17" />
      <!-- Buttons -->
      <circle cx="28" cy="15" r="1.3" fill="rgba(240, 245, 250, 0.08)" />
      <circle cx="31" cy="18" r="1.3" fill="rgba(240, 245, 250, 0.08)" />
    </g>

    <!-- Star / Sparkle (Lower Right) -->
    <g transform="translate(380, 345)">
      <path d="M 12 2 L 15 9 L 22 12 L 15 15 L 12 22 L 9 15 L 2 12 L 9 9 Z" fill="rgba(240, 245, 250, 0.04)" />
    </g>

    <!-- Location Pin (Far Lower Right) -->
    <g transform="translate(440, 355)">
      <path d="M 14 3 C 8 3 4 7 4 13 C 4 20 14 27 14 27 C 14 27 24 20 24 13 C 24 7 20 3 14 3 Z" />
      <circle cx="14" cy="11" r="3" />
    </g>

    <!-- Envelope / Mail (Bottom Far Left) -->
    <g transform="translate(25, 420)">
      <rect x="4" y="6" width="24" height="17" rx="2" />
      <polyline points="4,7 16,16 28,7" />
    </g>

    <!-- Bicycle (Bottom Center) -->
    <g transform="translate(240, 425) scale(0.9)">
      <circle cx="8" cy="18" r="7" />
      <circle cx="28" cy="18" r="7" />
      <polyline points="8,18 16,18 22,9 28,18" />
      <polyline points="16,18 14,8" />
      <line x1="12" y1="8" x2="16" y2="8" />
      <line x1="21" y1="8" x2="24" y2="7" />
    </g>

    <!-- Little Coffee / Tea Cup (Bottom Right) -->
    <g transform="translate(365, 435)">
      <path d="M 4 8 L 20 8 C 20 17 17 20 12 20 C 7 20 4 17 4 8 Z" />
      <path d="M 20 10 C 23 10 23 15 20 16" />
      <line x1="2" y1="22" x2="22" y2="22" />
    </g>

    <!-- Chat Bubbles Double (Bottom Far Right) -->
    <g transform="translate(440, 440)">
      <rect x="3" y="4" width="16" height="12" rx="3" />
      <path d="M 7 16 L 4 19 L 6 16" />
      <rect x="12" y="10" width="15" height="11" rx="3" />
      <path d="M 23 21 L 25 24 L 24 21" />
    </g>

    <!-- Micro Star Clusters (Filling gaps subtly) -->
    <g fill="rgba(240, 245, 250, 0.08)" stroke="none">
      <circle cx="95" cy="110" r="1.5" />
      <circle cx="240" cy="90" r="1.4" />
      <circle cx="380" cy="110" r="1.5" />
      <circle cx="485" cy="115" r="1.3" />
      <circle cx="75" cy="210" r="1.4" />
      <circle cx="320" cy="190" r="1.6" />
      <circle cx="195" cy="275" r="1.4" />
      <circle cx="420" cy="285" r="1.5" />
      <circle cx="95" cy="370" r="1.4" />
      <circle cx="325" cy="375" r="1.5" />
      <circle cx="480" cy="405" r="1.3" />
      <circle cx="190" cy="475" r="1.5" />
      <circle cx="310" cy="485" r="1.4" />
    </g>
  </g>
</svg>
