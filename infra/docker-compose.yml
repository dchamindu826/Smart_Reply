# Production on one server. See docs/deploy.md.
#   cd infra && cp .env.example .env && (edit .env) && docker compose up -d --build
name: smart-reply

x-api-env: &api-env
  NODE_ENV: production
  PORT: "4000"
  APP_URL: https://${DOMAIN}
  API_URL: https://${DOMAIN}
  TRUST_PROXY: "true"
  DATABASE_URL: postgres://smart:${POSTGRES_PASSWORD}@postgres:5432/smart_reply
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  STORAGE_LOCAL_DIR: /app/backend/storage
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-smart-reply}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-Smart Reply <no-reply@example.com>}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
  SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-LUMI AI Admin}
  META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v26.0}
  EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: smart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: smart_reply
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart -d smart_reply"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10

  # Runs migrations and the first-admin seed, then exits. The API waits for it.
  migrate:
    build: { context: .., dockerfile: backend/Dockerfile }
    image: smart-reply-api:latest
    environment: *api-env
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/db/seed.js"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    image: smart-reply-api:latest
    restart: unless-stopped
    environment: *api-env
    ports:
      - "127.0.0.1:4020:4000"
    volumes: [storage:/app/backend/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      retries: 5

  worker:
    image: smart-reply-api:latest
    restart: unless-stopped
    environment: *api-env
    command: ["node", "dist/worker.js"]
    volumes: [storage:/app/backend/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    deploy: { replicas: 2 }
    stop_grace_period: 30s

  web:
    build: { context: .., dockerfile: frontend/Dockerfile }
    image: smart-reply-web:latest
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - "127.0.0.1:3020:3000"
    depends_on: [api]

  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [web, api]

volumes:
  pgdata:
  redisdata:
  storage:
  caddydata:
  caddyconfig:
