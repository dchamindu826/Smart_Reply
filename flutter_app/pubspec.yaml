name: smart_reply
description: Smart Reply by LUMI AI — WhatsApp chats and calls for your team.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  dio: ^5.7.0
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.3.2
  socket_io_client: ^2.0.3+1
  image_picker: ^1.1.2
  file_picker: ^13.4.0
  record: ^7.2.0
  just_audio: ^0.9.40
  path_provider: ^2.1.4
  url_launcher: ^6.3.0
  flutter_webrtc: ^1.6.3
  firebase_core: ^4.14.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^17.2.3
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  mime: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo_mark.png
    - assets/wa_doodle_light.jpg
    - assets/wa_doodle_dark.jpg
